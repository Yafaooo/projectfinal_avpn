<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tableTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="holoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00f2ff;stop-opacity:0" />
    </radialGradient>
    <filter id="blurFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
    </filter>
    <filter id="neonGlow">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Walls -->
  <rect width="1024" height="1024" fill="url(#wallGrad)" />
  <path d="M0 0 L512 300 L1024 0 V1024 H0 Z" fill="#0a0a12" opacity="0.5" />
  
  <!-- Perspective Lines -->
  <line x1="0" y1="0" x2="512" y2="400" stroke="#1e272e" stroke-width="1" />
  <line x1="1024" y1="0" x2="512" y2="400" stroke="#1e272e" stroke-width="1" />
  
  <!-- Ceiling Panels -->
  <rect x="200" y="20" width="624" height="40" fill="#2c3e50" rx="5" />
  <rect x="250" y="30" width="524" height="10" fill="#00f2ff" filter="url(#neonGlow)" opacity="0.8" />
  <rect x="200" y="80" width="624" height="30" fill="#2c3e50" rx="5" />
  
  <!-- Floor Reflection -->
  <rect x="0" y="600" width="1024" height="424" fill="url(#floorGrad)" />
  <ellipse cx="512" cy="850" rx="400" ry="100" fill="url(#holoGlow)" opacity="0.2" />

  <!-- Side Server Racks (Left) -->
  <rect x="20" y="300" width="120" height="450" fill="#161b22" rx="5" />
  <g id="serverNodes">
    <rect x="30" y="320" width="100" height="10" fill="#00ff41" opacity="0.6">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
    </rect>
    <rect x="30" y="340" width="100" height="10" fill="#00ff41" opacity="0.8" />
    <rect x="30" y="360" width="100" height="10" fill="#00f2ff" opacity="0.4" />
    <rect x="30" y="380" width="100" height="10" fill="#00ff41" opacity="0.7" />
    <rect x="30" y="400" width="100" height="10" fill="#00f2ff" opacity="0.9" />
    <rect x="30" y="420" width="100" height="10" fill="#00ff41" opacity="0.5" />
  </g>
  <use href="#serverNodes" y="150" />

  <!-- Laboratory Workstation (Center) -->
  <path d="M200 750 L824 750 L950 950 L74 950 Z" fill="url(#tableTop)" stroke="#7f8c8d" stroke-width="2" />
  <rect x="250" y="740" width="524" height="10" fill="#bdc3c7" />
  
  <!-- Glass Beakers and Vials -->
  <g id="vials" transform="translate(250, 680)">
    <rect x="10" y="20" width="20" height="50" fill="rgba(0, 242, 255, 0.3)" stroke="#fff" stroke-width="1" rx="2" />
    <rect x="12" y="45" width="16" height="23" fill="#00f2ff" opacity="0.7" />
    
    <rect x="40" y="10" width="25" height="60" fill="rgba(255, 0, 255, 0.3)" stroke="#fff" stroke-width="1" rx="2" />
    <rect x="42" y="40" width="21" height="28" fill="#ff00ff" opacity="0.6" />
    
    <rect x="75" y="30" width="15" height="40" fill="rgba(0, 255, 65, 0.3)" stroke="#fff" stroke-width="1" rx="2" />
    <rect x="77" y="50" width="11" height="18" fill="#00ff41" opacity="0.8" />
  </g>

  <!-- Robotic Arm (Right) -->
  <g transform="translate(850, 750) scale(0.8)">
    <rect x="-20" y="0" width="40" height="100" fill="#34495e" />
    <circle cx="0" cy="0" r="25" fill="#2c3e50" />
    <path d="M0 0 L-100 -150 L-80 -170 L20 -20 Z" fill="#7f8c8d" />
    <circle cx="-90" cy="-160" r="15" fill="#34495e" />
    <path d="M-90 -160 L-50 -300 L-30 -290 L-70 -150 Z" fill="#95a5a6" />
    <rect x="-60" y="-320" width="40" height="20" fill="#00f2ff" filter="url(#neonGlow)" />
  </g>

  <!-- Central Holographic DNA -->
  <g transform="translate(512, 450)">
    <ellipse cx="0" cy="180" rx="100" ry="30" fill="url(#holoGlow)" opacity="0.5" />
    <g id="dnaStrand">
      <circle cx="-30" cy="-100" r="5" fill="#00f2ff" filter="url(#neonGlow)">
        <animate attributeName="cy" values="-100;-50;-100" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="30" cy="-100" r="5" fill="#ff00ff" filter="url(#neonGlow)">
        <animate attributeName="cy" values="-50;-100;-50" dur="3s" repeatCount="indefinite" />
      </circle>
      <line x1="-30" y1="-100" x2="30" y2="-100" stroke="#fff" stroke-width="1" opacity="0.3">
         <animate attributeName="y1" values="-100;-50;-100" dur="3s" repeatCount="indefinite" />
         <animate attributeName="y2" values="-50;-100;-50" dur="3s" repeatCount="indefinite" />
      </line>
      <use href="#dnaStrand" transform="translate(0, 20)" />
      <use href="#dnaStrand" transform="translate(0, 40)" />
      <use href="#dnaStrand" transform="translate(0, 60)" />
      <use href="#dnaStrand" transform="translate(0, 80)" />
      <use href="#dnaStrand" transform="translate(0, -20)" />
      <use href="#dnaStrand" transform="translate(0, -40)" />
      <use href="#dnaStrand" transform="translate(0, -60)" />
      <use href="#dnaStrand" transform="translate(0, -80)" />
    </g>
  </g>

  <!-- Floating UI Screens -->
  <g transform="translate(650, 250)">
    <rect width="200" height="120" fill="rgba(0, 242, 255, 0.1)" stroke="#00f2ff" stroke-width="1" rx="10" />
    <path d="M20 40 Q 50 10, 80 40 T 140 40" fill="none" stroke="#00f2ff" stroke-width="2">
        <animate attributeName="d" values="M20 40 Q 50 10, 80 40 T 140 40; M20 40 Q 50 70, 80 40 T 140 40; M20 40 Q 50 10, 80 40 T 140 40" dur="4s" repeatCount="indefinite" />
    </path>
    <rect x="20" y="80" width="160" height="5" fill="#00f2ff" opacity="0.3" />
    <rect x="20" y="90" width="100" height="5" fill="#00f2ff" opacity="0.3" />
    <circle cx="170" cy="30" r="10" fill="none" stroke="#ff00ff" stroke-width="2" />
  </g>
  
  <g transform="translate(180, 250)">
    <rect width="180" height="150" fill="rgba(255, 255, 255, 0.05)" stroke="#fff" stroke-width="0.5" rx="5" />
    <text x="10" y="30" fill="#00f2ff" font-family="monospace" font-size="12">ANALYSIS: 98%</text>
    <rect x="10" y="50" width="150" height="2" fill="#fff" opacity="0.2" />
    <g>
      <rect x="10" y="70" width="20" height="40" fill="#00ff41" />
      <rect x="40" y="85" width="20" height="25" fill="#00ff41" />
      <rect x="70" y="60" width="20" height="50" fill="#00ff41" />
      <rect x="100" y="90" width="20" height="20" fill="#00ff41" />
      <rect x="130" y="75" width="20" height="35" fill="#00ff41" />
    </g>
  </g>

  <!-- Microscope Device -->
  <g transform="translate(450, 760)">
    <rect x="0" y="100" width="120" height="20" fill="#2c3e50" rx="5" />
    <rect x="50" y="20" width="20" height="80" fill="#34495e" />
    <path d="M60 20 L20 60" stroke="#7f8c8d" stroke-width="10" stroke-linecap="round" />
    <circle cx="20" cy="60" r="15" fill="#1a1a2e" stroke="#fff" stroke-width="1" />
    <rect x="30" y="90" width="60" height="5" fill="#00f2ff" filter="url(#neonGlow)" />
  </g>

  <!-- Floor Lighting Strips -->
  <rect x="0" y="980" width="1024" height="5" fill="#00f2ff" filter="url(#neonGlow)" opacity="0.6" />
  <rect x="100" y="600" width="5" height="424" fill="#00f2ff" opacity="0.1" />
  <rect x="924" y="600" width="5" height="424" fill="#00f2ff" opacity="0.1" />

  <!-- Particles/Dust in Light -->
  <g opacity="0.4">
    <circle cx="300" cy="400" r="1" fill="#fff" />
    <circle cx="700" cy="500" r="1.5" fill="#fff" />
    <circle cx="450" cy="300" r="1" fill="#fff" />
    <circle cx="550" cy="600" r="2" fill="#fff" />
    <circle cx="800" cy="350" r="1" fill="#fff" />
    <circle cx="200" cy="550" r="1.2" fill="#fff" />
    <circle cx="512" cy="512" r="1" fill="#fff" />
    <circle cx="350" cy="200" r="1.5" fill="#fff" />
  </g>

  <!-- Overhead Light Glare -->
  <ellipse cx="512" cy="0" rx="600" ry="150" fill="url(#holoGlow)" opacity="0.1" filter="url(#blurFilter)" />
  
  <!-- Subtle Framing Vignette -->
  <rect width="1024" height="1024" fill="none" stroke="black" stroke-width="100" opacity="0.3" rx="0" />

</svg>