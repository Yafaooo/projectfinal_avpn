<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Lighting and Snow Textures -->
    <radialGradient id="goldenHourLight" cx="0.5" cy="0.2" r="0.8" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="50%" stop-color="#ffe0b2"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </radialGradient>
    <linearGradient id="snowBaseGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e0f2f7"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f8ff"/>
    </linearGradient>
    <filter id="blurForest">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.8"/>
      </feComponentTransfer>
    </filter>
    <filter id="blurDepth">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
    <filter id="fineFurDetail">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.05" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blurredGlow"/>
      <feFlood flood-color="white" flood-opacity="0.8" result="flood"/>
      <feComposite in="flood" in2="blurredGlow" operator="atop" result="compositeGlow"/>
      <feMerge>
        <feMergeNode in="compositeGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="eyeGlint">
      <feSpecularLighting surfaceScale="5" specularConstant="1" specularExponent="20" lighting-color="white" result="specularOut">
        <fePointLight x="100" y="100" z="200"/>
      </feSpecularLighting>
      <feComposite in="SourceGraphic" in2="specularOut" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>
    <linearGradient id="huskyFurWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e0e0e0"/>
    </linearGradient>
    <linearGradient id="huskyFurGrey" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a0a0a0"/>
      <stop offset="50%" stop-color="#808080"/>
      <stop offset="100%" stop-color="#606060"/>
    </linearGradient>
    <radialGradient id="iceBlueEye" cx="0.5" cy="0.5" r="0.5" fx="0.6" fy="0.4">
      <stop offset="0%" stop-color="#bbdeff"/>
      <stop offset="30%" stop-color="#81d4fa"/>
      <stop offset="70%" stop-color="#4fc3f7"/>
      <stop offset="100%" stop-color="#2196f3"/>
    </radialGradient>
    <radialGradient id="pupil" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="noseGradient" cx="0.5" cy="0.5" r="0.7" fx="0.6" fy="0.4">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="50%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#404040"/>
    </radialGradient>
    <linearGradient id="steamGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background: Blurred Winter Forest -->
  <rect x="0" y="0" width="1024" height="1024" fill="#607d8b"/>
  <g filter="url(#blurForest)">
    <path fill="#4caf50" d="M0,0 H1024 V500 H0 Z"/>
    <path fill="#2e7d32" d="M0,0 Q256,100 512,0 Q768,-100 1024,0 V400 H0 Z"/>
    <path fill="#5c8a5c" d="M0,100 Q150,200 300,150 L450,250 L600,180 L750,280 L900,200 L1024,300 V600 H0 Z"/>
    <path fill="#8bc34a" d="M0,250 C100,350 200,250 300,300 L400,200 L500,350 L600,250 L700,380 L800,300 L900,400 L1024,350 V700 H0 Z"/>
    <circle cx="200" cy="150" r="100" fill="#a5d6a7"/>
    <circle cx="800" cy="200" r="120" fill="#a5d6a7"/>
    <rect x="0" y="0" width="1024" height="500" fill="url(#goldenHourLight)" opacity="0.1"/>
  </g>

  <!-- Snow Expanse -->
  <rect x="0" y="450" width="1024" height="574" fill="url(#snowBaseGradient)"/>
  <g filter="url(#blurDepth)">
    <path fill="#e3f2fd" d="M0,500 Q256,480 512,500 Q768,520 1024,500 V1024 H0 Z"/>
    <path fill="#bbdefb" d="M0,600 Q256,580 512,600 Q768,620 1024,600 V1024 H0 Z"/>
    <path fill="#90caf9" d="M0,700 Q256,680 512,700 Q768,720 1024,700 V1024 H0 Z"/>
  </g>
  <path fill="#f0f8ff" d="M0,750 C200,730 400,780 600,760 C800,740 1024,800 V1024 H0 Z" opacity="0.8"/>
  <path fill="url(#goldenHourLight)" d="M0,450 Q256,480 512,450 Q768,420 1024,450 V1024 H0 Z" opacity="0.2"/>

  <!-- Husky Body (Base Shape - Large areas of fur) -->
  <g transform="translate(512, 650) scale(0.6) rotate(-5)">
    <ellipse cx="0" cy="0" rx="300" ry="400" fill="#f0f0f0" filter="url(#fineFurDetail)"/>
    <path d="M-250,-300 C-400,-150 -400,100 -250,250 C-100,400 100,400 250,250 C400,100 400,-150 250,-300 Z" fill="#ffffff"/>
    <path d="M-150,-200 C-250,-50 -250,50 -150,150 C-50,250 50,250 150,150 C250,50 250,-50 150,-200 Z" fill="url(#huskyFurWhite)"/>

    <!-- Head & Face -->
    <g transform="translate(0, -200) scale(0.8) rotate(5)">
      <!-- Main head shape -->
      <path d="M-200,-150 C-300,-50 -300,150 -150,250 C0,350 150,350 250,250 C350,150 350,-50 200,-150 Z" fill="url(#huskyFurWhite)"/>
      <!-- Grey markings -->
      <path d="M-180,-120 C-250,-30 -250,80 -120,180 C-40,250 40,250 120,180 C200,100 200,-30 150,-100 Z" fill="url(#huskyFurWhite)"/>
      <path d="M-150,-100 C-200,-20 -200,60 -100,150 C-30,200 30,200 100,150 C180,70 180,-20 120,-90 Z" fill="url(#huskyFurGrey)" opacity="0.9" filter="url(#fineFurDetail)"/>

      <!-- Snout -->
      <path d="M-80,100 C-100,150 -60,200 0,220 C60,200 100,150 80,100 Z" fill="url(#huskyFurWhite)"/>
      <path d="M-50,120 C-60,150 -30,180 0,190 C30,180 60,150 50,120 Z" fill="url(#huskyFurWhite)" filter="url(#fineFurDetail)"/>

      <!-- Nose -->
      <circle cx="0" cy="200" r="25" fill="url(#noseGradient)" filter="url(#eyeGlint)"/>
      <circle cx="0" cy="200" r="8" fill="#555" opacity="0.5"/>
      <path d="M-10,205 C-5,210 5,210 10,205 Z" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>

      <!-- Eyes -->
      <g transform="translate(-80, 0)">
        <ellipse cx="0" cy="0" rx="35" ry="25" fill="url(#iceBlueEye)" filter="url(#eyeGlint)"/>
        <circle cx="5" cy="0" r="10" fill="url(#pupil)"/>
        <ellipse cx="15" cy="-8" rx="7" ry="5" fill="white" opacity="0.8" filter="url(#softGlow)"/>
        <path d="M-30,-10 C-35,-15 -25,-20 -15,-15 Q-5,-10 0,-10 Z" fill="#a0a0a0" opacity="0.7"/> <!-- Eyelid shadow -->
        <path d="M-25,10 C-30,15 -20,20 -10,15 Q0,10 5,10 Z" fill="#a0a0a0" opacity="0.7"/> <!-- Eyelid shadow -->
      </g>
      <g transform="translate(80, 0) scale(-1, 1)"> <!-- Flipped for symmetry -->
        <ellipse cx="0" cy="0" rx="35" ry="25" fill="url(#iceBlueEye)" filter="url(#eyeGlint)"/>
        <circle cx="5" cy="0" r="10" fill="url(#pupil)"/>
        <ellipse cx="15" cy="-8" rx="7" ry="5" fill="white" opacity="0.8" filter="url(#softGlow)"/>
        <path d="M-30,-10 C-35,-15 -25,-20 -15,-15 Q-5,-10 0,-10 Z" fill="#a0a0a0" opacity="0.7"/> <!-- Eyelid shadow -->
        <path d="M-25,10 C-30,15 -20,20 -10,15 Q0,10 5,10 Z" fill="#a0a0a0" opacity="0.7"/> <!-- Eyelid shadow -->
      </g>

      <!-- Ears -->
      <path d="M-150,-150 C-200,-250 -100,-280 -80,-180 Z" fill="url(#huskyFurGrey)"/>
      <path d="M150,-150 C200,-250 100,-280 80,-180 Z" fill="url(#huskyFurGrey)"/>
      <path d="M-130,-160 C-170,-220 -110,-240 -90,-165 Z" fill="url(#huskyFurWhite)"/>
      <path d="M130,-160 C170,-220 110,-240 90,-165 Z" fill="url(#huskyFurWhite)"/>

      <!-- Fur Details (hundreds of paths for individual strands) -->
      <!-- White fur on face/cheeks -->
      <g opacity="0.7" fill="white" stroke="rgba(255,255,255,0.7)" stroke-width="0.8">
        <path d="M-120,50 C-150,20 -180,30 -160,80"/>
        <path d="M-130,60 C-160,30 -190,40 -170,90"/>
        <path d="M-140,70 C-170,40 -200,50 -180,100"/>
        <path d="M-100,80 C-130,50 -160,60 -140,110"/>
        <path d="M-90,90 C-120,60 -150,70 -130,120"/>
        <path d="M-80,100 C-110,70 -140,80 -120,130"/>
        <path d="M-70,110 C-100,80 -130,90 -110,140"/>
        <path d="M-60,120 C-90,90 -120,100 -100,150"/>
        <path d="M-50,130 C-80,100 -110,110 -90,160"/>
        <path d="M-40,140 C-70,110 -100,120 -80,170"/>
        <path d="M-30,150 C-60,120 -90,130 -70,180"/>
        <path d="M-20,160 C-50,130 -80,140 -60,190"/>
        <path d="M-10,170 C-40,140 -70,150 -50,200"/>
        <path d="M-0,180 C-30,150 -60,160 -40,210"/>

        <!-- Around eyes -->
        <path d="M-100,-20 C-110,-40 -90,-50 -70,-30"/>
        <path d="M-90,-10 C-100,-30 -80,-40 -60,-20"/>
        <path d="M-80,0 C-90,-20 -70,-30 -50,-10"/>
        <path d="M-70,10 C-80,-10 -60,-20 -40,0"/>

        <!-- Forehead fur -->
        <path d="M-50,-100 C-70,-130 -40,-150 -20,-120"/>
        <path d="M-30,-110 C-50,-140 -20,-160 0,-130"/>
        <path d="M-10,-120 C-30,-150 0,-170 20,-140"/>
        <path d="M10,-110 C-10,-140 20,-160 40,-130"/>
        <path d="M30,-100 C10,-130 40,-150 60,-120"/>
        <path d="M50,-90 C30,-120 60,-140 80,-110"/>
      </g>

      <!-- Grey fur on top of head and cheeks -->
      <g opacity="0.6" fill="url(#huskyFurGrey)" stroke="rgba(160,160,160,0.6)" stroke-width="0.7">
        <path d="M-150,-80 C-180,-100 -160,-120 -130,-90"/>
        <path d="M-160,-70 C-190,-90 -170,-110 -140,-80"/>
        <path d="M-170,-60 C-200,-80 -180,-100 -150,-70"/>
        <path d="M-180,-50 C-210,-70 -190,-90 -160,-60"/>

        <!-- Top head -->
        <path d="M-50,-150 C-70,-180 -40,-200 -20,-170"/>
        <path d="M-30,-160 C-50,-190 -20,-210 0,-180"/>
        <path d="M-10,-170 C-30,-200 0,-220 20,-190"/>
        <path d="M10,-160 C-10,-190 20,-210 40,-180"/>
        <path d="M30,-150 C10,-180 40,-200 60,-170"/>
        <path d="M50,-140 C30,-170 60,-190 80,-160"/>

        <!-- Right side (flipped for symmetry) -->
        <g transform="scale(-1,1)">
            <path d="M-120,50 C-150,20 -180,30 -160,80"/>
            <path d="M-130,60 C-160,30 -190,40 -170,90"/>
            <path d="M-140,70 C-170,40 -200,50 -180,100"/>
            <path d="M-100,80 C-130,50 -160,60 -140,110"/>
            <path d="M-90,90 C-120,60 -150,70 -130,120"/>
            <path d="M-80,100 C-110,70 -140,80 -120,130"/>
            <path d="M-70,110 C-100,80 -130,90 -110,140"/>
            <path d="M-60,120 C-90,90 -120,100 -100,150"/>
            <path d="M-50,130 C-80,100 -110,110 -90,160"/>
            <path d="M-40,140 C-70,110 -100,120 -80,170"/>
            <path d="M-30,150 C-60,120 -90,130 -70,180"/>
            <path d="M-20,160 C-50,130 -80,140 -60,190"/>
            <path d="M-10,170 C-40,140 -70,150 -50,200"/>
            <path d="M-0,180 C-30,150 -60,160 -40,210"/>
            <path d="M-100,-20 C-110,-40 -90,-50 -70,-30"/>
            <path d="M-90,-10 C-100,-30 -80,-40 -60,-20"/>
            <path d="M-80,0 C-90,-20 -70,-30 -50,-10"/>
            <path d="M-70,10 C-80,-10 -60,-20 -40,0"/>
            <path d="M-150,-80 C-180,-100 -160,-120 -130,-90"/>
            <path d="M-160,-70 C-190,-90 -170,-110 -140,-80"/>
            <path d="M-170,-60 C-200,-80 -180,-100 -150,-70"/>
            <path d="M-180,-50 C-210,-70 -190,-90 -160,-60"/>
        </g>
      </g>
      <!-- Even finer fur details -->
      <g opacity="0.4" fill="url(#huskyFurWhite)" stroke="rgba(255,255,255,0.4)" stroke-width="0.5">
        <path d="M-125,55 C-155,25 -185,35 -165,85"/>
        <path d="M-135,65 C-165,35 -195,45 -175,95"/>
        <path d="M-145,75 C-175,45 -205,55 -185,105"/>
        <path d="M-105,85 C-135,55 -165,65 -145,115"/>
        <path d="M-95,95 C-125,65 -155,75 -135,125"/>
        <path d="M-85,105 C-115,75 -145,85 -125,135"/>
        <path d="M-75,115 C-105,85 -135,95 -115,145"/>
        <path d="M-65,125 C-95,95 -125,105 -105,155"/>
        <path d="M-55,135 C-85,105 -115,115 -95,165"/>
        <path d="M-45,145 C-75,115 -105,125 -85,175"/>
        <path d="M-35,155 C-65,125 -95,135 -75,185"/>
        <path d="M-25,165 C-55,135 -85,145 -65,195"/>
        <path d="M-15,175 C-45,145 -75,155 -55,205"/>
        <path d="M-5,185 C-35,155 -65,165 -45,215"/>
        <g transform="scale(-1,1)">
            <path d="M-125,55 C-155,25 -185,35 -165,85"/>
            <path d="M-135,65 C-165,35 -195,45 -175,95"/>
            <path d="M-145,75 C-175,45 -205,55 -185,105"/>
            <path d="M-105,85 C-135,55 -165,65 -145,115"/>
            <path d="M-95,95 C-125,65 -155,75 -135,125"/>
            <path d="M-85,105 C-115,75 -145,85 -125,135"/>
            <path d="M-75,115 C-105,85 -135,95 -115,145"/>
            <path d="M-65,125 C-95,95 -125,105 -105,155"/>
            <path d="M-55,135 C-85,105 -115,115 -95,165"/>
            <path d="M-45,145 C-75,115 -105,125 -85,175"/>
            <path d="M-35,155 C-65,125 -95,135 -75,185"/>
            <path d="M-25,165 C-55,135 -85,145 -65,195"/>
            <path d="M-15,175 C-45,145 -75,155 -55,205"/>
            <path d="M-5,185 C-35,155 -65,165 -45,215"/>
        </g>
      </g>

      <!-- Whiskers -->
      <path d="M-70,150 L-150,140" stroke="#333" stroke-width="1.5" stroke-opacity="0.7"/>
      <path d="M-65,160 L-145,170" stroke="#333" stroke-width="1.5" stroke-opacity="0.7"/>
      <path d="M-60,170 L-140,200" stroke="#333" stroke-width="1.5" stroke-opacity="0.7"/>
      <path d="M70,150 L150,140" stroke="#333" stroke-width="1.5" stroke-opacity="0.7"/>
      <path d="M65,160 L145,170" stroke="#333" stroke-width="1.5" stroke-opacity="0.7"/>
      <path d="M60,170 L140,200" stroke="#333" stroke-width="1.5" stroke-opacity="0.7"/>
    </g>
  </g>

  <!-- Subtle steam from breath -->
  <g transform="translate(480, 800) scale(0.6)">
    <ellipse cx="0" cy="0" rx="30" ry="20" fill="url(#steamGradient)" filter="url(#blurDepth)" opacity="0.8"/>
    <ellipse cx="20" cy="-10" rx="25" ry="15" fill="url(#steamGradient)" filter="url(#blurDepth)" opacity="0.7"/>
    <ellipse cx="-10" cy="-20" rx="20" ry="12" fill="url(#steamGradient)" filter="url(#blurDepth)" opacity="0.6"/>
  </g>

  <!-- Golden hour light overlay -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#goldenHourLight)" opacity="0.1"/>
  <rect x="0" y="0" width="1024" height="1024" fill="rgba(255, 223, 186, 0.05)"/> <!-- Very subtle warm tint -->

</svg>