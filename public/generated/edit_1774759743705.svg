<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="75%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1A2A4E"/>
      <stop offset="50%" stop-color="#0F1B38"/>
      <stop offset="100%" stop-color="#091223"/>
    </radialGradient>

    <radialGradient id="centerGlowGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="20%" stop-color="#FFA500"/>
      <stop offset="60%" stop-color="#FF6347"/>
      <stop offset="100%" stop-color="#FF1493" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="petalGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B68EE"/>
      <stop offset="50%" stop-color="#9370DB"/>
      <stop offset="100%" stop-color="#BA55D3"/>
    </linearGradient>

    <linearGradient id="petalGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00CED1"/>
      <stop offset="50%" stop-color="#20B2AA"/>
      <stop offset="100%" stop-color="#66CDAA"/>
    </linearGradient>

    <linearGradient id="petalGradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF69B4"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <linearGradient id="petalOutlineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0FFFF"/>
      <stop offset="50%" stop-color="#AFEEEE"/>
      <stop offset="100%" stop-color="#40E0D0"/>
    </linearGradient>

    <linearGradient id="baseGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#36454F"/>
      <stop offset="50%" stop-color="#2F4F4F"/>
      <stop offset="100%" stop-color="#36454F"/>
    </linearGradient>

    <linearGradient id="coreLineGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFF0"/>
      <stop offset="50%" stop-color="#ADD8E6"/>
      <stop offset="100%" stop-color="#4682B4"/>
    </linearGradient>

    <radialGradient id="sphereGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="lightBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#backgroundGradient)"/>

  <!-- Distant Stars/Particles -->
  <g opacity="0.6">
    <circle cx="100" cy="50" r="1.5" fill="white"/>
    <circle cx="900" cy="150" r="2" fill="white"/>
    <circle cx="250" cy="700" r="1" fill="white"/>
    <circle cx="800" cy="900" r="1.8" fill="white"/>
    <circle cx="500" cy="100" r="1.2" fill="white"/>
    <circle cx="150" cy="950" r="1.6" fill="white"/>
    <circle cx="950" cy="300" r="1" fill="white"/>
    <circle cx="700" cy="50" r="1.3" fill="white"/>
    <circle cx="300" cy="980" r="2.1" fill="white"/>
    <circle cx="600" cy="200" r="1.4" fill="white"/>
    <circle cx="50" cy="400" r="1.7" fill="white"/>
    <circle cx="970" cy="750" r="1.9" fill="white"/>
  </g>

  <!-- Core Base Structure -->
  <g transform="translate(0, 100)">
    <path d="M0 800 Q200 750 512 780 T1024 800 V1024 H0 Z" fill="url(#baseGradient)"/>
    <path d="M0 780 Q250 720 512 750 T1024 780 V1024 H0 Z" fill="#202A44" opacity="0.5"/>
    <path d="M100 760 Q300 700 512 730 T924 760 V1024 H100 Z" fill="#1C2132" opacity="0.7"/>
    <ellipse cx="512" cy="740" rx="300" ry="30" fill="#202A44" filter="url(#softGlow)"/>
    <ellipse cx="512" cy="740" rx="250" ry="20" fill="#2F4F4F" filter="url(#softGlow)"/>
  </g>

  <!-- Central "Energy Tree" or Spire -->
  <g transform="translate(512, 1024) scale(0.9) rotate(0) translate(-512, -1024)">
    <!-- Main stem/trunk -->
    <path d="M492 730 C492 600 502 300 512 150 C522 300 532 600 532 730 Z" fill="#20B2AA" filter="url(#softGlow)"/>
    <path d="M500 730 C500 600 508 300 512 150 C516 300 524 600 524 730 Z" fill="#AFEEEE"/>
    <path d="M508 730 C508 600 510 300 512 150 C514 300 516 600 516 730 Z" fill="url(#coreLineGradient)"/>

    <!-- Inner Glow at the top -->
    <circle cx="512" cy="150" r="80" fill="url(#centerGlowGradient)" filter="url(#glow)"/>
    <circle cx="512" cy="150" r="40" fill="#FFFFFF" filter="url(#lightBlur)"/>
    <circle cx="512" cy="150" r="20" fill="#FFFFF0"/>

    <!-- Petals/Leaves -->
    <g transform="translate(512, 150)">
      <g filter="url(#softGlow)">
        <!-- Layer 1 -->
        <path d="M0 0 Q-100 -50 -100 -150 Q-50 -200 0 -250 Q50 -200 100 -150 Q100 -50 0 0 Z" fill="url(#petalGradient1)" transform="rotate(20) scale(1.2)"/>
        <path d="M0 0 Q-100 -50 -100 -150 Q-50 -200 0 -250 Q50 -200 100 -150 Q100 -50 0 0 Z" fill="url(#petalGradient2)" transform="rotate(70) scale(1.1)"/>
        <path d="M0 0 Q-100 -50 -100 -150 Q-50 -200 0 -250 Q50 -200 100 -150 Q100 -50 0 0 Z" fill="url(#petalGradient3)" transform="rotate(120) scale(1.2)"/>
        <path d="M0 0 Q-100 -50 -100 -150 Q-50 -200 0 -250 Q50 -200 100 -150 Q100 -50 0 0 Z" fill="url(#petalGradient1)" transform="rotate(170) scale(1.1)"/>
        <path d="M0 0 Q-100 -50 -100 -150 Q-50 -200 0 -250 Q50 -200 100 -150 Q100 -50 0 0 Z" fill="url(#petalGradient2)" transform="rotate(220) scale(1.2)"/>
        <path d="M0 0 Q-100 -50 -100 -150 Q-50 -200 0 -250 Q50 -200 100 -150 Q100 -50 0 0 Z" fill="url(#petalGradient3)" transform="rotate(270) scale(1.1)"/>
        <path d="M0 0 Q-100 -50 -100 -150 Q-50 -200 0 -250 Q50 -200 100 -150 Q100 -50 0 0 Z" fill="url(#petalGradient1)" transform="rotate(320) scale(1.2)"/>

        <!-- Layer 2 (smaller, slightly offset) -->
        <path d="M0 0 Q-80 -40 -80 -120 Q-40 -160 0 -200 Q40 -160 80 -120 Q80 -40 0 0 Z" fill="url(#petalOutlineGradient)" transform="rotate(45) scale(1.05)"/>
        <path d="M0 0 Q-80 -40 -80 -120 Q-40 -160 0 -200 Q40 -160 80 -120 Q80 -40 0 0 Z" fill="url(#petalOutlineGradient)" transform="rotate(95) scale(1.05)"/>
        <path d="M0 0 Q-80 -40 -80 -120 Q-40 -160 0 -200 Q40 -160 80 -120 Q80 -40 0 0 Z" fill="url(#petalOutlineGradient)" transform="rotate(145) scale(1.05)"/>
        <path d="M0 0 Q-80 -40 -80 -120 Q-40 -160 0 -200 Q40 -160 80 -120 Q80 -40 0 0 Z" fill="url(#petalOutlineGradient)" transform="rotate(195) scale(1.05)"/>
        <path d="M0 0 Q-80 -40 -80 -120 Q-40 -160 0 -200 Q40 -160 80 -120 Q80 -40 0 0 Z" fill="url(#petalOutlineGradient)" transform="rotate(245) scale(1.05)"/>
        <path d="M0 0 Q-80 -40 -80 -120 Q-40 -160 0 -200 Q40 -160 80 -120 Q80 -40 0 0 Z" fill="url(#petalOutlineGradient)" transform="rotate(295) scale(1.05)"/>
        <path d="M0 0 Q-80 -40 -80 -120 Q-40 -160 0 -200 Q40 -160 80 -120 Q80 -40 0 0 Z" fill="url(#petalOutlineGradient)" transform="rotate(345) scale(1.05)"/>
      </g>
    </g>
  </g>

  <!-- Swirling Energy Particles -->
  <g opacity="0.8" filter="url(#lightBlur)">
    <circle cx="512" cy="350" r="10" fill="url(#sphereGlow)" transform="rotate(30, 512, 512)"/>
    <circle cx="400" cy="450" r="8" fill="url(#sphereGlow)" transform="rotate(60, 512, 512)"/>
    <circle cx="620" cy="400" r="12" fill="url(#sphereGlow)" transform="rotate(90, 512, 512)"/>
    <circle cx="512" cy="600" r="9" fill="url(#sphereGlow)" transform="rotate(120, 512, 512)"/>
    <circle cx="350" cy="550" r="7" fill="url(#sphereGlow)" transform="rotate(150, 512, 512)"/>
    <circle cx="670" cy="500" r="11" fill="url(#sphereGlow)" transform="rotate(180, 512, 512)"/>
    <circle cx="450" cy="300" r="10" fill="url(#sphereGlow)" transform="rotate(210, 512, 512)"/>
    <circle cx="570" cy="380" r="9" fill="url(#sphereGlow)" transform="rotate(240, 512, 512)"/>
    <circle cx="420" cy="650" r="8" fill="url(#sphereGlow)" transform="rotate(270, 512, 512)"/>
    <circle cx="600" cy="620" r="10" fill="url(#sphereGlow)" transform="rotate(300, 512, 512)"/>
    <circle cx="512" cy="480" r="15" fill="url(#sphereGlow)" transform="rotate(330, 512, 512)"/>
    <circle cx="300" cy="380" r="6" fill="url(#sphereGlow)" transform="rotate(15, 512, 512)"/>
    <circle cx="720" cy="350" r="7" fill="url(#sphereGlow)" transform="rotate(75, 512, 512)"/>
    <circle cx="280" cy="500" r="9" fill="url(#sphereGlow)" transform="rotate(135, 512, 512)"/>
    <circle cx="750" cy="600" r="8" fill="url(#sphereGlow)" transform="rotate(200, 512, 512)"/>
    <circle cx="320" cy="700" r="11" fill="url(#sphereGlow)" transform="rotate(260, 512, 512)"/>
    <circle cx="700" cy="720" r="9" fill="url(#sphereGlow)" transform="rotate(310, 512, 512)"/>
    <circle cx="450" cy="250" r="7" fill="url(#sphereGlow)" transform="rotate(50, 512, 512)"/>
    <circle cx="580" cy="270" r="8" fill="url(#sphereGlow)" transform="rotate(100, 512, 512)"/>
    <circle cx="400" cy="750" r="6" fill="url(#sphereGlow)" transform="rotate(220, 512, 512)"/>
    <circle cx="650" cy="700" r="7" fill="url(#sphereGlow)" transform="rotate(290, 512, 512)"/>
    <circle cx="250" cy="600" r="5" fill="url(#sphereGlow)" transform="rotate(170, 512, 512)"/>
  </g>

  <!-- Abstract Crystalline Shards around the base -->
  <g opacity="0.9">
    <path d="M400 750 L450 720 L420 700 Z" fill="#E0FFFF" transform="rotate(10, 512, 740)" filter="url(#lightBlur)"/>
    <path d="M550 750 L500 720 L530 700 Z" fill="#ADD8E6" transform="rotate(-10, 512, 740)" filter="url(#lightBlur)"/>
    <path d="M350 780 L380 760 L360 740 Z" fill="#AFEEEE" transform="rotate(20, 512, 740)" filter="url(#lightBlur)"/>
    <path d="M680 780 L650 760 L670 740 Z" fill="#40E0D0" transform="rotate(-20, 512, 740)" filter="url(#lightBlur)"/>
    <path d="M480 760 L490 740 L470 720 Z" fill="#E0FFFF" transform="scale(0.8) translate(100, 150)" filter="url(#lightBlur)"/>
    <path d="M580 760 L570 740 L590 720 Z" fill="#AFEEEE" transform="scale(0.8) translate(-100, 150)" filter="url(#lightBlur)"/>
    <path d="M512 680 L492 650 L532 650 Z" fill="url(#petalOutlineGradient)" transform="scale(0.7) translate(200, 250)" filter="url(#lightBlur)"/>
    <path d="M512 680 L492 650 L532 650 Z" fill="url(#petalOutlineGradient)" transform="scale(0.7) translate(-200, 250)" filter="url(#lightBlur)"/>
    <path d="M512 680 L492 650 L532 650 Z" fill="url(#petalOutlineGradient)" transform="rotate(90) scale(0.7) translate(200, 250)" filter="url(#lightBlur)"/>
  </g>

  <!-- Subtle light streaks -->
  <g opacity="0.3">
    <path d="M512 150 L512 0" stroke="url(#petalOutlineGradient)" stroke-width="3" filter="url(#lightBlur)"/>
    <path d="M512 150 L512 0" stroke="url(#petalOutlineGradient)" stroke-width="2" transform="rotate(20, 512, 150)" filter="url(#lightBlur)"/>
    <path d="M512 150 L512 0" stroke="url(#petalOutlineGradient)" stroke-width="2" transform="rotate(-20, 512, 150)" filter="url(#lightBlur)"/>
    <path d="M512 150 L512 0" stroke="url(#petalOutlineGradient)" stroke-width="1.5" transform="rotate(40, 512, 150)" filter="url(#lightBlur)"/>
    <path d="M512 150 L512 0" stroke="url(#petalOutlineGradient)" stroke-width="1.5" transform="rotate(-40, 512, 150)" filter="url(#lightBlur)"/>
  </g>

</svg>