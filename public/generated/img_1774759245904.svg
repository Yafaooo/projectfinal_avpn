<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#050507;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1b26;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="floorGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#3a4a6e;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c2e3a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4a4e69;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#12131a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bgGrad)" />
  
  <!-- Floor Reflection -->
  <ellipse cx="512" cy="850" rx="600" ry="150" fill="url(#floorGlow)" />
  <rect x="0" y="750" width="1024" height="274" fill="rgba(255,255,255,0.02)" />
  <line x1="0" y1="750" x2="1024" y2="750" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Car Shadow -->
  <path d="M150 780 Q 512 820 874 780 L 840 820 Q 512 850 184 820 Z" fill="rgba(0,0,0,0.8)" filter="url(#glow)" />

  <!-- Car Body Main -->
  <path d="M180 650 C 180 600 250 550 400 520 C 550 490 750 510 850 580 L 880 720 L 820 760 L 220 760 L 180 650" fill="url(#carBodyGrad)" stroke="#000" stroke-width="1" />
  
  <!-- Side Panels and Aerodynamics -->
  <path d="M220 760 L 820 760 L 800 700 C 700 680 300 680 240 700 Z" fill="#1a1c24" />
  <path d="M300 700 Q 512 670 720 700" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
  
  <!-- Glass Cockpit -->
  <path d="M380 535 C 420 480 580 470 700 520 C 750 540 800 580 820 620 L 450 620 Z" fill="rgba(30,40,60,0.85)" stroke="rgba(100,150,255,0.3)" stroke-width="1" />
  <path d="M420 500 Q 550 485 680 515" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" />
  
  <!-- Cockpit Reflection -->
  <path d="M400 530 Q 550 500 720 540" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="10" stroke-linecap="round" />

  <!-- Headlight Strips (The 2026 Future Look) -->
  <path d="M185 660 Q 200 680 240 685" fill="none" stroke="#00f2ff" stroke-width="4" filter="url(#bloom)" />
  <path d="M190 670 Q 205 690 245 695" fill="none" stroke="#00f2ff" stroke-width="2" filter="url(#bloom)" opacity="0.6" />
  
  <!-- Front Detail -->
  <path d="M180 650 L 250 650 L 270 700 L 195 720 Z" fill="#0f111a" />
  <rect x="200" y="690" width="40" height="2" fill="#00f2ff" filter="url(#glow)" />

  <!-- Wheels -->
  <!-- Back Wheel -->
  <g transform="translate(730, 740)">
    <circle cx="0" cy="0" r="75" fill="#050505" stroke="#1a1a1a" stroke-width="5" />
    <circle cx="0" cy="0" r="62" fill="url(#rimGrad)" />
    <!-- Spokes -->
    <path d="M-55 0 L 55 0 M 0 -55 L 0 55 M -40 -40 L 40 40 M -40 40 L 40 -40" stroke="#000" stroke-width="3" />
    <circle cx="0" cy="0" r="15" fill="#111" stroke="#333" />
    <circle cx="0" cy="0" r="62" fill="none" stroke="#00f2ff" stroke-width="1.5" filter="url(#glow)" opacity="0.4" />
  </g>

  <!-- Front Wheel -->
  <g transform="translate(320, 740)">
    <circle cx="0" cy="0" r="75" fill="#050505" stroke="#1a1a1a" stroke-width="5" />
    <circle cx="0" cy="0" r="62" fill="url(#rimGrad)" />
    <!-- Spokes -->
    <path d="M-55 0 L 55 0 M 0 -55 L 0 55 M -40 -40 L 40 40 M -40 40 L 40 -40" stroke="#000" stroke-width="3" />
    <circle cx="0" cy="0" r="15" fill="#111" stroke="#333" />
    <circle cx="0" cy="0" r="62" fill="none" stroke="#00f2ff" stroke-width="1.5" filter="url(#glow)" opacity="0.4" />
  </g>

  <!-- Body Highlights & Reflections -->
  <path d="M250 560 Q 512 530 800 600" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="8" />
  <path d="M850 600 L 870 700" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  
  <!-- Taillight Glow (hinting at the back profile) -->
  <path d="M860 620 L 880 650 L 875 680" fill="none" stroke="#ff0044" stroke-width="4" filter="url(#bloom)" opacity="0.8" />

  <!-- Futuristic Sensors/Emblems -->
  <circle cx="210" cy="655" r="3" fill="#00f2ff" filter="url(#glow)" />
  <rect x="500" y="750" width="100" height="1" fill="#00f2ff" opacity="0.3" filter="url(#glow)" />
  
  <!-- Ground Accents / Speed Lines -->
  <rect x="100" y="880" width="200" height="1" fill="rgba(0,242,255,0.2)" />
  <rect x="600" y="900" width="300" height="1" fill="rgba(0,242,255,0.1)" />
  <rect x="300" y="920" width="400" height="1" fill="rgba(255,255,255,0.05)" />

  <!-- Air Intakes / Vents -->
  <path d="M780 680 Q 750 720 720 730" fill="none" stroke="#000" stroke-width="4" />
  <path d="M280 730 Q 300 700 330 690" fill="none" stroke="#000" stroke-width="3" />

  <!-- Rear Wing Detail -->
  <path d="M810 570 L 860 580 Q 880 590 885 610" fill="none" stroke="#2c2e3a" stroke-width="3" />
  
  <!-- Underglow -->
  <rect x="300" y="760" width="440" height="6" rx="3" fill="#00f2ff" opacity="0.15" filter="url(#bloom)" />

  <!-- Fine Details: Panel gaps -->
  <path d="M450 620 L 450 760" stroke="rgba(0,0,0,0.5)" stroke-width="1" />
  <path d="M680 620 L 680 760" stroke="rgba(0,0,0,0.5)" stroke-width="1" />
  
  <!-- Roofline Highlight -->
  <path d="M380 535 Q 512 470 700 520" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- Side Camera (No Mirrors) -->
  <path d="M410 580 L 430 585 L 430 595 L 410 590 Z" fill="#111" stroke="#333" stroke-width="1" />
  <circle cx="428" cy="590" r="1.5" fill="#00f2ff" filter="url(#glow)" />

  <!-- Floating HUD / Tech elements in background -->
  <g opacity="0.2">
    <circle cx="900" cy="200" r="40" fill="none" stroke="#00f2ff" stroke-width="0.5" />
    <path d="M880 200 L 920 200 M 900 180 L 900 220" stroke="#00f2ff" stroke-width="0.5" />
    <text x="865" y="260" font-family="monospace" font-size="10" fill="#00f2ff">SYS_ACTIVE: 2026</text>
  </g>

  <!-- Final Aesthetic Touches -->
  <rect x="0" y="0" width="1024" height="1024" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="40" />
</svg>